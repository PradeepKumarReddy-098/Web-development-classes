<!DOCTYPE html>
<html>
    <head></head>
    <style>
        .container{
            border: 6px solid #000;
            height: 700px;
            display: flex;
            flex-direction: row;
            justify-content:flex-start;
            align-items: flex-start;
            gap: 10px;
            
        }
        .box{
            height:100px;
            width: 100px;
            border: 4px solid #000;
            background-color: blue;
            
        }
        .box1{
            background-color: green;
            flex-grow: 1;
        }

        .box2{
            flex-grow: 2;
        }

    </style>
    <body>
        <div class="container">
            <div class="box box1">1</div>
            <div class="box box2">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
        </div>
    </body>
</html>
